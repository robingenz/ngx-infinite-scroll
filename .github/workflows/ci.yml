name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: 24

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build library
        run: npm run build:lib
      - name: Build workspace app
        run: npm run build
      - name: Test library
        run: npx ng test @robingenz/ngx-infinite-scroll --watch=false
      - name: Test workspace app
        run: npx ng test ngx-infinite-scroll-workspace --watch=false
      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngx-infinite-scroll
          path: dist/robingenz/ngx-infinite-scroll
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Prettier
        run: npm run lint
